<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Direct User Control</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <style>
    /* Intel-style blue palette (scoped to this page). */
    :root {
      --intel-blue: #0068b5;
      --intel-blue-strong: #0071c5;
      --intel-blue-deep: #003c71;
      --intel-blue-light: #00c7fd;
      --intel-blue-hi: #2ea3e0;
      --intel-ink: #cfe9fb;
      --intel-track: rgba(0, 199, 253, 0.16);
      --intel-line: rgba(0, 199, 253, 0.34);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    .mobile-app {
      display: grid;
      gap: 6px;
      padding: 6px;
      height: 100dvh;
      overflow: hidden;
        grid-template-rows: minmax(0, 1fr) auto;
      --mobile-fab-bottom-offset: calc(36px + env(safe-area-inset-bottom, 0px));
    }

      .mobile-controls {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        min-height: 60px;
        padding: 0 6px calc(6px + env(safe-area-inset-bottom, 0px));
      }

    .mobile-page-title {
      margin: 0;
      font-size: 16px;
      line-height: 1.1;
      letter-spacing: 0.03em;
      color: var(--intel-ink);
      text-shadow: 0 2px 10px rgba(0, 104, 181, 0.28);
    }

    .mobile-header {
      display: flex;
      align-items: center;
      min-height: 32px;
      margin: 0 0 6px;
      padding: 4px 8px;
      border-radius: 10px;
      background: rgba(0, 60, 113, 0.30);
      border: 1px solid var(--intel-line);
    }

    .mobile-timeout-countdown {
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      color: var(--intel-ink);
      background: rgba(0, 199, 253, 0.14);
      border: 1px solid var(--intel-line);
    }

    .mobile-timeout-countdown[data-state="warn"] {
      color: #fde68a;
      background: rgba(217, 119, 6, 0.18);
      border-color: rgba(217, 119, 6, 0.4);
    }

    .mobile-timeout-countdown[data-state="urgent"] {
      color: #fecaca;
      background: rgba(220, 38, 38, 0.2);
      border-color: rgba(220, 38, 38, 0.45);
    }

    .mobile-app>.panel {
      min-height: 0;
      min-width: 0;
      padding: 10px;
    }

    .mobile-remote-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    .mobile-video-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
    }

    .mobile-remote-panel.show-h-scroll .mobile-h-scroll {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .mobile-remote-panel.show-v-scroll .mobile-v-scroll {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
    }

    .mobile-remote-panel.fit-mode .mobile-h-scroll {
      display: none;
    }

    .mobile-remote-panel.fit-mode .mobile-v-scroll {
      display: none;
    }

    .mobile-status-chip {
      position: relative;
      z-index: 1;
      margin: 0 0 10px;
      padding: 8px 10px;
      max-width: 100%;
      backdrop-filter: blur(8px);
      background: rgba(5, 9, 19, 0.72);
      display: none;
    }

    body.debug-status .mobile-status-chip {
      display: block;
    }

    /* One-line status bar: status text (left) + time-left countdown (right). */
    .mobile-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 0 0 8px;
      min-height: 24px;
    }

    .mobile-status-notice {
      flex: 1 1 auto;
      min-width: 0;
      text-align: left;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--intel-ink);
      opacity: 0;
      transition: opacity 140ms ease, color 140ms ease;
    }

    .mobile-status-notice.is-visible {
      opacity: 1;
    }

    /* Tones: info (default) = Intel light; active = sharing; warn/error = amber/red. */
    .mobile-status-notice[data-state="info"] {
      color: var(--intel-ink);
    }

    .mobile-status-notice[data-state="active"] {
      color: #86efac;
    }

    .mobile-status-notice[data-state="warn"] {
      color: #fcd34d;
    }

    .mobile-status-notice[data-state="error"] {
      color: #fca5a5;
    }

    .mobile-video {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      flex: 0 0 auto;
      border-radius: 12px;
      border: 1px solid rgba(0, 104, 181, 0.55);
      background: #ffffff;
      object-fit: contain;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    #remoteVideo.mobile-video {
      width: 100%;
      height: auto;
      min-height: 0;
      aspect-ratio: auto;
    }

    .mobile-video-scroll {
      width: 100%;
      height: 100%;
      min-height: 0;
      min-width: 0;
      overflow: auto;
      -webkit-overflow-scrolling: auto;
      scrollbar-gutter: stable both-edges;
      overscroll-behavior: none;
      touch-action: none;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      border-radius: 12px;
      border: 2px solid var(--intel-blue);
      background: #ffffff;
      box-shadow:
        0 0 0 2px rgba(0, 104, 181, 0.30),
        0 12px 28px rgba(2, 6, 23, 0.40);
      scrollbar-width: auto;
      /* thumb / track -- track transparent, Intel-blue thumb */
      scrollbar-color: var(--intel-blue) transparent;
    }

    .mobile-video-scroll::-webkit-scrollbar {
      height: 14px;
      width: 14px;
    }

    .mobile-video-scroll::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 999px;
    }

    /* Thumb stays hidden until the surface is hovered or actively scrolled. */
    .mobile-video-scroll::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 999px;
      transition: background 140ms ease;
    }

    /* Desktop / mouse only: touch devices have no hover, so gate the reveal to
       pointer devices. On phones the custom overlay scrollbars below are the
       affordance (shown on drag, auto-hidden), so we don't need the native one. */
    @media (hover: hover) and (pointer: fine) {
      .mobile-video-scroll:hover::-webkit-scrollbar-thumb,
      .mobile-video-scroll:active::-webkit-scrollbar-thumb {
        background: var(--intel-blue);
      }

      .mobile-video-scroll::-webkit-scrollbar-thumb:hover {
        background: var(--intel-blue-strong);
      }
    }

    /* Touch devices: the native scrollbar can't hover-reveal and its reserved
       gutter wastes ~28px of width on a phone. Hide it and reclaim the space;
       the Intel-blue overlay scrollbars remain the on-drag indicator. */
    @media (pointer: coarse) {
      .mobile-video-scroll {
        scrollbar-width: none;
        scrollbar-gutter: auto;
      }

      .mobile-video-scroll::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
    }

    .mobile-h-scroll {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      height: 24px;
      border-radius: 999px;
      background: var(--intel-track);
      border: 1px solid var(--intel-line);
      z-index: 3;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .mobile-h-scroll.is-disabled {
      opacity: 0;
      pointer-events: none;
    }

    .mobile-v-scroll {
      position: absolute;
      top: 16px;
      right: 12px;
      bottom: 16px;
      width: 24px;
      border-radius: 999px;
      background: var(--intel-track);
      border: 1px solid var(--intel-line);
      z-index: 3;
      opacity: 0;
      transform: translateX(6px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .mobile-v-scroll.is-disabled {
      opacity: 0;
      pointer-events: none;
    }

    .mobile-calibration-veil {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 24, 48, 0.90);
      color: #e5e7eb;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease;
    }

    .mobile-calibration-veil.is-visible {
      opacity: 1;
    }

    .mobile-v-scroll-thumb {
      position: absolute;
      top: 0;
      left: 3px;
      width: 16px;
      height: 56px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--intel-blue-hi), var(--intel-blue));
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .mobile-h-scroll-thumb {
      position: absolute;
      top: 3px;
      left: 0;
      height: 16px;
      width: 56px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--intel-blue-hi), var(--intel-blue));
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .keyboard-fab {
      position: absolute;
        right: 8px;
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 48px;
      min-height: 48px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: linear-gradient(180deg, var(--intel-blue-hi), var(--intel-blue));
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.28);
      color: #ffffff;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: grab;
    }

    .mobile-finish-btn {
        position: static;
      z-index: 2;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, var(--intel-blue-hi), var(--intel-blue));
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .keyboard-fab.is-dragging {
      cursor: grabbing;
    }

    .keyboard-fab svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .keyboard-fab span {
      font-weight: 700;
    }

    .mobile-hidden-keyboard {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .mobile-hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .mobile-app {
        gap: 4px;
        padding: 4px;
      }

      .mobile-controls {
        min-height: 52px;
        padding: 0 4px calc(4px + env(safe-area-inset-bottom, 0px));
      }

      .mobile-finish-btn {
        padding: 6px 9px;
        font-size: 12px;
      }

      .keyboard-fab {
        right: 4px;
        bottom: calc(4px + env(safe-area-inset-bottom, 0px));
        min-width: 42px;
        min-height: 42px;
        padding: 0 10px;
      }

      .keyboard-fab svg {
        width: 18px;
        height: 18px;
      }

      .mobile-page-title {
        font-size: 14px;
      }

      .mobile-header {
        min-height: 28px;
        margin: 0 0 4px;
        padding: 3px 7px;
      }

      .mobile-app>.panel {
        padding: 8px;
      }

      .mobile-status-row {
        margin: 0 0 6px;
        min-height: 20px;
      }

      .mobile-status-notice {
        font-size: 12px;
      }
    }

    @media (min-width: 768px) {
      .mobile-app {
        max-width: 900px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <main class="mobile-app">
    <section class="panel mobile-remote-panel">
      <div class="mobile-header">
        <h1 class="mobile-page-title">Direct User Control over Remote Pages</h1>
      </div>
      <div class="mobile-status-row">
        <span id="statusNotice" class="mobile-status-notice" data-state="idle" aria-live="polite"></span>
        <span id="timeoutCountdown" class="mobile-timeout-countdown" data-state="idle" aria-live="polite" hidden></span>
      </div>
      <div class="mobile-video-shell">
        <div class="mobile-video-scroll">
          <video id="remoteVideo" class="mobile-video" autoplay playsinline muted tabindex="0"></video>
        </div>
        <div id="calibrationVeil" class="mobile-calibration-veil" aria-live="polite" aria-hidden="true">Calibrating...</div>
        <div id="hScrollOverlay" class="mobile-h-scroll" aria-hidden="true">
          <div id="hScrollThumb" class="mobile-h-scroll-thumb"></div>
        </div>
        <div id="vScrollOverlay" class="mobile-v-scroll" aria-hidden="true">
          <div id="vScrollThumb" class="mobile-v-scroll-thumb"></div>
        </div>
      </div>
    </section>
    <div class="mobile-controls">
      <button id="finishBtn" class="mobile-finish-btn" type="button">Finish</button>
      <button id="keyboardFab" class="keyboard-fab" type="button" aria-label="Open keyboard" title="Open keyboard">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor"
            d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2Zm0 12H4V7h16v10ZM6 9h2v2H6V9Zm0 3h2v2H6v-2Zm0 3h12v2H6v-2Zm3-3h2v2H9v-2Zm0-3h2v2H9V9Zm3 0h2v2h-2V9Zm0 3h2v2h-2v-2Zm3-3h2v2h-2V9Zm0 3h2v2h-2v-2Zm3-3h2v5h-2V9Z" />
        </svg>
      </button>
    </div>
  </main>

  <textarea id="keyboardCapture" class="mobile-hidden-keyboard" aria-label="Mobile keyboard capture" autocomplete="off"
    autocapitalize="off" spellcheck="false"></textarea>

  <pre id="logs" hidden></pre>

  <script src="/vendor/socket.io.min.js"></script>
  <script src="/vendor/sc.websocket.js"></script>
  <script src="/vendor/owt.js"></script>
  <script type="module" src="/src/client.js"></script>
</body>

</html>
